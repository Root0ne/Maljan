# Dependabot keeps the four dependency surfaces current: the uv workspace, the
# web console, the GitHub Actions the workflows run, and the base images the
# compose stack builds from. Security updates are enabled in the repository
# settings and do not depend on this schedule.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "dev"
    labels: ["dependencies", "python"]
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "dev"
    labels: ["dependencies", "web"]
    groups:
      web-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # The type stubs follow whichever Node line the images and CI run; a
      # major here is part of that migration, not an update of its own.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "dev"
    labels: ["dependencies", "ci"]

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "dev"
    labels: ["dependencies", "docker"]
    ignore:
      # A runtime major is a deliberate migration with its own testing, not a
      # weekly bump: the interpreter and the Node line move by hand.
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
