# Dependabot keeps the dependency surfaces current: the uv workspace, the web
# console and the docs site, the sidecars' pinned packages, the GitHub Actions
# the workflows run, the base images the compose stack builds from and the
# images it pulls. Security updates are enabled in the repository settings and
# do not depend on this schedule.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "dev"
    labels: ["dependencies", "python"]
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # 2.x is a deliberate migration (the sidecars build on mcp.server.fastmcp),
      # pinned below 2 in pyproject.toml until it is done.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
      # Published without its JSON schemas, so it validates nothing
      # (oasis-open/cti-stix-validator#248); a later release is still offered.
      - dependency-name: "stix2-validator"
        versions: [">= 3.3.1, < 3.3.2"]
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "dev"
    labels: ["dependencies", "web"]
    groups:
      web-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # The type stubs follow whichever Node line the images and CI run; a
      # major here is part of that migration, not an update of its own.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint (pulled in by eslint-config-next) does not support
      # TypeScript 7; the ESLint step fails until it does.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  # The documentation site; same Node line and the same TypeScript hold as
  # the console.
  - package-ecosystem: "npm"
    directory: "/apps/docs"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "dev"
    labels: ["dependencies", "documentation"]
    groups:
      docs-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  # The sidecars of one analysis program each pin their own packages by hash:
  # the shared plumbing's (every such image installs it), oletools', unblob's
  # and webcrack's. The MCP SDK major is held as in the workspace above.
  - package-ecosystem: "pip"
    directory: "/services/cli-sidecar"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "dev"
    labels: ["dependencies", "python"]
    groups:
      cli-sidecar-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/services/oletools-mcp"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "dev"
    labels: ["dependencies", "python"]
    groups:
      oletools-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/services/unblob-mcp"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "dev"
    labels: ["dependencies", "python"]
    groups:
      unblob-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/services/webcrack-mcp"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "dev"
    labels: ["dependencies"]
    groups:
      webcrack-minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "dev"
    labels: ["dependencies", "ci"]
    groups:
      # init, analyze and upload-sarif are three steps of one release. A job
      # that starts one version and finishes another fails outright ("Loaded a
      # configuration file for version X, but running version Y"), so a bump
      # that arrives one step at a time can never pass on its own.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "dev"
    labels: ["dependencies", "docker"]
    ignore:
      # A runtime major is a deliberate migration with its own testing, not a
      # weekly bump: the interpreter and the Node line move by hand.
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # The images compose pulls (postgres, redis, qdrant, minio), each pinned by
  # tag and digest; the entry above reads the Dockerfiles only. A digest bump
  # here keeps its tag, and a tag bump moves both.
  - package-ecosystem: "docker-compose"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "dev"
    labels: ["dependencies", "docker"]
    ignore:
      # A database or queue major is a data migration, not a weekly bump.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
      # The server moves with the pinned qdrant-client (pyproject.toml): a
      # server ahead of the client logs a compatibility warning on every run.
      # Raise both together, by hand; digest bumps of the pinned tag still come.
      - dependency-name: "qdrant/qdrant"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
