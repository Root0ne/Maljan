# Dependabot keeps the four dependency surfaces current: the uv workspace, the
# web console, the GitHub Actions the workflows run, and the base images the
# compose stack builds from. Security updates are enabled in the repository
# settings and do not depend on this schedule.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "dev"
    labels: ["dependencies", "python"]
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "dev"
    labels: ["dependencies", "web"]
    groups:
      web-minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "dev"
    labels: ["dependencies", "ci"]

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "dev"
    labels: ["dependencies", "docker"]
