name: Release

# A pushed v* tag builds the sdist and the wheel, builds and pushes the
# container images to ghcr.io, signs every artefact with cosign keyless,
# attests its SLSA build provenance, and attaches the Python artefacts, their
# signatures and the provenance to the tag's GitHub release (RELEASING.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python:
    name: sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache: a release builds from nothing a pull request could have left.
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: The tag names the package version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not name version ${version} in pyproject.toml"
            exit 1
          fi

      - name: Build
        run: uv build --sdist --wheel --no-sources --out-dir dist

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      # Each artefact's keyless signature as a Sigstore bundle beside it, and
      # the provenance bundle (a DSSE envelope around the in-toto SLSA
      # statement) under the name a release's provenance is looked for by.
      - name: Sign and collect
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          for artefact in dist/*.whl dist/*.tar.gz; do
            cosign sign-blob --yes --bundle "${artefact}.sigstore.json" "${artefact}"
          done
          cp "${PROVENANCE}" "dist/malspark-${GITHUB_REF_NAME}.intoto.jsonl"
          (cd dist && sha256sum -- *.whl *.tar.gz > SHA256SUMS)

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Each image is built on a runner of its target's architecture, without
  # emulation, and pushed by digest alone; the manifests job below joins an
  # image's architectures under its tags. Every image is built for amd64 and
  # arm64 but die-mcp, whose program has no arm64 Linux build (ghidra-mcp,
  # the other, is not released here).
  images:
    name: Image (${{ matrix.name }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          # The compose stack's own builds, each from the context compose
          # gives it. The console's NEXT_PUBLIC_* values are baked at build
          # time; these are compose's defaults.
          - name: backend
            arch: amd64
            context: .
            file: docker/Dockerfile.backend
          - name: backend
            arch: arm64
            context: .
            file: docker/Dockerfile.backend
          - name: frontend
            arch: amd64
            context: .
            file: docker/Dockerfile.frontend
            build-args: |
              NEXT_PUBLIC_API_URL=http://localhost:8000
              NEXT_PUBLIC_WS_URL=ws://localhost:8000
              NEXT_PUBLIC_AUTH_DISABLED=false
          - name: frontend
            arch: arm64
            context: .
            file: docker/Dockerfile.frontend
            build-args: |
              NEXT_PUBLIC_API_URL=http://localhost:8000
              NEXT_PUBLIC_WS_URL=ws://localhost:8000
              NEXT_PUBLIC_AUTH_DISABLED=false
          - name: minio
            arch: amd64
            context: docker
            file: docker/Dockerfile.minio
          - name: minio
            arch: arm64
            context: docker
            file: docker/Dockerfile.minio
          - name: die-mcp
            arch: amd64
            context: services
            file: services/die-mcp/Dockerfile
          - name: goresym-mcp
            arch: amd64
            context: services
            file: services/goresym-mcp/Dockerfile
          - name: goresym-mcp
            arch: arm64
            context: services
            file: services/goresym-mcp/Dockerfile
          - name: ilspy-mcp
            arch: amd64
            context: services
            file: services/ilspy-mcp/Dockerfile
          - name: ilspy-mcp
            arch: arm64
            context: services
            file: services/ilspy-mcp/Dockerfile
          - name: jadx-mcp
            arch: amd64
            context: services
            file: services/jadx-mcp/Dockerfile
          - name: jadx-mcp
            arch: arm64
            context: services
            file: services/jadx-mcp/Dockerfile
          - name: oletools-mcp
            arch: amd64
            context: services
            file: services/oletools-mcp/Dockerfile
          - name: oletools-mcp
            arch: arm64
            context: services
            file: services/oletools-mcp/Dockerfile
          - name: unblob-mcp
            arch: amd64
            context: services
            file: services/unblob-mcp/Dockerfile
          - name: unblob-mcp
            arch: arm64
            context: services
            file: services/unblob-mcp/Dockerfile
          - name: webcrack-mcp
            arch: amd64
            context: services
            file: services/webcrack-mcp/Dockerfile
          - name: webcrack-mcp
            arch: arm64
            context: services
            file: services/webcrack-mcp/Dockerfile
          - name: yarax-mcp
            arch: amd64
            context: services
            file: services/yarax-mcp/Dockerfile
          - name: yarax-mcp
            arch: arm64
            context: services
            file: services/yarax-mcp/Dockerfile
    env:
      IMAGE: ghcr.io/root0ne/malspark-${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      # The provenance is GitHub's attestation on the manifest list, so Buildx
      # adds none of its own and each pushed digest is the image manifest.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false

      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.name }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  manifests:
    name: Image manifest (${{ matrix.name }})
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        name:
          - backend
          - frontend
          - minio
          - die-mcp
          - goresym-mcp
          - ilspy-mcp
          - jadx-mcp
          - oletools-mcp
          - unblob-mcp
          - webcrack-mcp
          - yarax-mcp
    env:
      IMAGE: ghcr.io/root0ne/malspark-${{ matrix.name }}
    steps:
      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.name }}-*
          path: digests
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # One list per image, naming each architecture's pushed digest, under
      # the release's tags; its digest is what is signed and attested.
      - name: Create the manifest list
        id: manifest
        working-directory: digests
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          args=()
          for tag in "${tags[@]}"; do args+=(--tag "$tag"); done
          for digest in *; do args+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${args[@]}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
          # A storage record exists only for an organisation's repository and
          # would need the artifact-metadata permission besides.
          create-storage-record: false

  release:
    name: GitHub release
    needs: [python, manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist

      # The release the tag already has (one made in the web UI) gets the
      # artefacts; otherwise a draft is made for the maintainer to publish.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${REPO}" > /dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --repo "${REPO}" --verify-tag --draft \
              --title "${GITHUB_REF_NAME}" --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/* --repo "${REPO}" --clobber
