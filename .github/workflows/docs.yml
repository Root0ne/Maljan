name: Docs

on:
  # The site is apps/docs; docs/examples/ is copied into it at build time.
  pull_request:
    branches: ["main", "dev"]
    paths: ["apps/docs/**", "docs/**", ".github/workflows/docs.yml"]
  push:
    branches: ["main"]
    paths: ["apps/docs/**", "docs/**", ".github/workflows/docs.yml"]
  # A release that changes no page still needs a first publication, and a
  # failed deployment needs a way to run again without an empty commit.
  workflow_dispatch:

permissions:
  contents: read

# Deployments queue rather than cancel: a Pages deployment stopped halfway
# leaves the site on whichever half landed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/docs/package-lock.json

      - name: Install docs dependencies
        working-directory: apps/docs
        run: npm ci

      - name: Type-check and lint
        working-directory: apps/docs
        run: |
          npm run types:check
          npm run lint

      # A static export under /Maljan; the build fails if an address the site
      # served before no longer leads to a page (scripts/old-urls.mjs).
      - name: Build the site
        working-directory: apps/docs
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Upload the site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/out

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
