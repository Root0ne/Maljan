name: Docs

on:
  # The pages are apps/docs/content/docs with their images in
  # apps/docs/public/assets and the files under docs/examples; the website that
  # renders them is built and published separately, at malspark.com.
  pull_request:
    branches: ["main", "dev"]
    paths: ["apps/docs/**", "docs/**", ".github/workflows/docs.yml"]
  push:
    branches: ["main"]
    paths: ["apps/docs/**", "docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes an older check of the same ref moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check the docs content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/docs/package-lock.json

      - name: Install the checker
        working-directory: apps/docs
        run: npm ci

      # Every page compiles as MDX with the frontmatter and components the site
      # reads, every meta.json parses, every link leads to a page, heading or
      # file, and every address the old site served still leads to a page.
      - name: Check the pages
        working-directory: apps/docs
        run: npm run check
