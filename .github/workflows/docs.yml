name: Docs

on:
  # The pages are apps/docs/content/docs with their images in
  # apps/docs/public/assets and the files under docs/examples; the website that
  # renders them is built and published separately, at malspark.com.
  pull_request:
    branches: ["main", "dev"]
    paths: ["apps/docs/**", "docs/**", ".github/workflows/docs.yml"]
  push:
    branches: ["main"]
    paths: ["apps/docs/**", "docs/**", ".github/workflows/docs.yml"]
  # A failed deployment needs a way to run again without an empty commit.
  workflow_dispatch:

permissions:
  contents: read

# Deployments queue rather than cancel: a Pages deployment stopped halfway
# leaves the site on whichever half landed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the docs content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/docs/package-lock.json

      - name: Install the checker
        working-directory: apps/docs
        run: npm ci

      # Every page compiles as MDX, every meta.json parses, and every link to
      # /docs/..., /assets/... or /examples/... leads to a page, heading or file.
      - name: Check the pages
        working-directory: apps/docs
        run: npm run check

      # The old address, https://root0ne.github.io/Maljan/, now only sends
      # readers on to the same page on malspark.com.
      - name: Write the redirect site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: apps/docs
        run: node scripts/pages-redirect.mjs "$RUNNER_TEMP/pages-redirect"

      - name: Upload the redirect site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages-redirect

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
