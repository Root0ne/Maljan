name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev", "feat/**"]

# The workflow reads the repository and nothing else; it references no secrets.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Evaluation artefacts are untouched
        if: github.ref != 'refs/heads/main'
        run: |
          set -euo pipefail
          # The measured numbers in the paper come from tests/evaluation/, and
          # no provider or tool-server branch may change them. Sub-project B
          # adds servers and a sandbox; it does not re-measure anything.
          # actions/checkout@v4 defaults to a depth-1 clone of this ref, which
          # shares no history with a depth-50 fetch of dev's tip, so unshallow
          # this ref first to give origin/dev a usable merge base. A plain
          # `git fetch origin dev` would land under the checkout's own
          # single-branch refspec instead of creating origin/dev, so fetch it
          # with an explicit refspec.
          git fetch --no-tags --unshallow origin || git fetch --no-tags --depth=200 origin "$(git rev-parse HEAD)"
          git fetch --no-tags --depth=50 origin +refs/heads/dev:refs/remotes/origin/dev
          changed="$(git diff --name-only origin/dev... -- tests/evaluation/)"
          if [ -n "$changed" ]; then
            echo "tests/evaluation/ must not change on this branch:"
            echo "$changed"
            exit 1
          fi

      # The same set the Makefile's PY_SOURCES names: the FastAPI app, the arq
      # worker, the two MCP sidecars and scripts/ were outside this gate.
      - name: Ruff lint
        run: uv run ruff check src/ tests/ apps/api/ network-mcp/ threatintel-mcp/ scripts/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/ apps/api/ network-mcp/ threatintel-mcp/ scripts/

      - name: mypy type check
        run: uv run mypy src/ apps/api/

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install semgrep
        run: pip install semgrep==1.176.0
      - name: Scan
        run: semgrep scan --config p/python --config p/security-audit --error --metrics=off src/ apps/api/ network-mcp/ threatintel-mcp/ scripts/

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: quality

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run test suite
        run: uv run pytest tests/ -q --tb=short

  test-qdrant:
    name: Qdrant Live Tests
    runs-on: ubuntu-latest
    needs: quality

    services:
      qdrant:
        image: qdrant/qdrant:v1.18.2
        ports:
          - 6333:6333

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Qdrant to be ready
        run: |
          echo "Waiting for Qdrant..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:6333/ > /dev/null 2>&1; then
              echo "Qdrant is ready after ${i} attempts."
              break
            fi
            echo "  attempt $i/30 — retrying in 2s"
            sleep 2
          done
          curl -sf http://localhost:6333/ || (echo "Qdrant did not start in time" && exit 1)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Qdrant live tests
        env:
          QDRANT_URL: http://localhost:6333
        run: uv run pytest tests/unit/test_qdrant_store.py -v

  frontend:
    name: Frontend (tsc, eslint, next build)
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      # A TypeScript error used to surface only when docker/Dockerfile.frontend
      # ran `next build` at deploy time; the e2e job mocks every route and never
      # compiles the production bundle.
      - name: Type check
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Production build
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps

      # Same entry point developers use. The wrapper strips Snap-injected env
      # that crashes WebKit on a confined desktop; on a runner there is nothing
      # to strip and it exec's straight through, so CI and local runs cannot
      # drift apart.
      - name: Run Playwright tests
        working-directory: apps/web
        run: npm run test:e2e
