name: Ghidra MCP image

on:
  # The image is built from a tree fetched at a pinned tag and patched, outside
  # this repository, so it breaks when the pin, its patch or the compose build
  # changes, and when something upstream of the tag (a Ghidra release asset, a
  # base image) moves. Those changes and a weekly run build it; other pull
  # requests do not, since the build takes minutes and downloads Ghidra.
  pull_request:
    branches: ["main", "dev"]
    paths:
      - "scripts/dev/fetch_external.sh"
      - "scripts/dev/patches/**"
      - "docker/docker-compose.yml"
      - ".github/workflows/ghidra-mcp.yml"
  push:
    branches: ["dev"]
    paths:
      - "scripts/dev/fetch_external.sh"
      - "scripts/dev/patches/**"
      - "docker/docker-compose.yml"
      - ".github/workflows/ghidra-mcp.yml"
  schedule:
    - cron: "23 3 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ghidra-mcp and wait for its healthcheck
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The checkout, data/samples among it, belongs to the runner's user, and
      # volume-init refuses a tree owned by any id but root's and the one it is
      # given, as a deployment whose ids do not match is told. So the services
      # run as the runner's ids, still non-root and with no capability.
      - name: Run the services as the checkout's owner
        run: |
          { echo "MALSPARK_UID=$(id -u)"; echo "MALSPARK_GID=$(id -g)"; } >> "$GITHUB_ENV"

      # The compose file refuses to start without these; no service that reads
      # them is built or started here, so each gets a throwaway random value.
      - name: Fill the compose file's required values
        run: |
          for name in POSTGRES_PASSWORD REDIS_PASSWORD MINIO_ROOT_USER MINIO_ROOT_PASSWORD JWT_SECRET_KEY SETTINGS_ENCRYPTION_KEY; do
            value=$(openssl rand -hex 16)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Fetch the pinned tree and apply its patch
        run: bash scripts/dev/fetch_external.sh ghidra-mcp

      - name: Build the image as the compose file does
        run: docker compose -f docker/docker-compose.yml --profile ghidra build ghidra-mcp

      # Started by the compose file, so it runs as it does in a deployment: the
      # worker's ids, no capability, no-new-privileges, its HOME and JVM options,
      # and the projects volume volume-init hands over (which builds the backend
      # image volume-init runs from).
      - name: Start it as the compose file does and wait for its healthcheck
        env:
          GHIDRA_MCP_AUTH_TOKEN: ${{ github.run_id }}-ci-only-token
        run: >-
          docker compose -f docker/docker-compose.yml --profile ghidra
          up -d --wait --wait-timeout 600 ghidra-mcp

      - name: Server log
        if: always()
        run: docker compose -f docker/docker-compose.yml --profile ghidra logs ghidra-mcp volume-init 2>&1 | tail -n 100 || true

      - name: Remove the containers and volumes
        if: always()
        run: docker compose -f docker/docker-compose.yml --profile ghidra down -v || true
