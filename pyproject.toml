[project]
name = "maljan"
version = "1.0.0"
description = "Multi-Agent Malware Analysis Pipeline powered by LangGraph"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain-core>=1.2.25",
    "langchain-openai>=1.1.12",
    "langchain-anthropic>=0.3.15",
    "langchain-ollama>=0.3.3",
    "langgraph>=1.1.6",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    "tiktoken>=0.9.0",
    "typer>=0.16.0",
    "qdrant-client>=1.17.1",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "pysigma>=1.3.3",
    "networkx>=3.6.1",
    "transformers>=5.6.2",
    "torch>=2.11.0",
    "mcp>=1.0.0",
    "nest-asyncio>=1.6.0",
    "fastmcp>=3.2.4",
    "langchain>=1.2.15",
    "langchain-google-genai>=4.2.1",
    "python-magic>=0.4.27",
    "python-magic-bin>=0.4.14",
    "django>=6.0.4",
    "pymongo>=4.17.0",
    "pillow>=12.2.0",
    "pefile>=2024.8.26",
]

[project.scripts]
maljan = "maljan.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "pre-commit>=4.2.0",
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Agent files contain LLM prompt strings that are intentionally long
"src/maljan/agents/*.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "langgraph.*",
    "langchain_core.*",
    "langchain_openai.*",
    "langchain_anthropic.*",
    "langchain_ollama.*",
    "tiktoken.*",
    "typer.*",
    "qdrant_client.*",
    "httpx.*",
    "langsmith.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
