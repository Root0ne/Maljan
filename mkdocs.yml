site_name: Maljan
site_description: Multi-Agent Malware Analysis Framework
site_url: https://root0ne.github.io/Maljan/
repo_name: Root0ne/Maljan
repo_url: https://github.com/Root0ne/Maljan
edit_uri: edit/dev/docs/

docs_dir: docs
# Theme overrides live beside the pages so a change to them runs the docs
# workflow; they are templates, not pages.
exclude_docs: |
  /overrides/

nav:
  - Get started:
      - Introduction: README.md
      - Quick start: getting-started.md
      - Console: console.md
  - Usage:
      - Running an analysis: usage/running-an-analysis.md
      - Teams and profiles: usage/teams.md
      - Reports and exports: usage/reports-and-exports.md
  - LLM providers:
      - providers/index.md
      - OpenAI-compatible: providers/openai-compatible.md
      - Anthropic: providers/anthropic.md
      - Gemini: providers/gemini.md
      - Ollama: providers/ollama.md
      - Local llama.cpp: providers/llama-cpp.md
  - Tools:
      - tools/index.md
      - Ghidra: tools/ghidra.md
      - radare2: tools/radare2.md
      - capa and YARA: tools/capa-yara.md
      - Sandboxes: tools/sandboxes.md
      - VirusTotal: tools/virustotal.md
      - Analysis and knowledge sidecars: tools/sidecars.md
      - Generic MCP servers: tools/generic-mcp.md
  - Integrations:
      - REST API: api.md
      - MCP servers: integrations/mcp-servers.md
      - CI: integrations/ci.md
  - Advanced:
      - Configuration: configuration.md
      - Architecture: architecture.md
      - Security: security.md
      - Deployment: deployment.md
      - Operations: operations.md
      - Development: development.md
  - Benchmark:
      - benchmark/index.md
      - "Score: all-tools, local Qwen3.6-35B": benchmark/scores/latrodectus-all-tools-local6.md
      - "Score: all-tools, hosted DeepSeek, run 5": benchmark/scores/latrodectus-all-tools-run5.md
      - "Score: all-tools, hosted DeepSeek, run 4": benchmark/scores/latrodectus-all-tools-run4.md
      - "Score: iteration 6, default model": benchmark/scores/latrodectus-iteration6-default.md
      - "Score: iteration 5, default model": benchmark/scores/latrodectus-iteration5-default.md
      - "Score: iteration 4, default model": benchmark/scores/latrodectus-iteration4-default.md
      - "Score: iteration 2, default model": benchmark/scores/latrodectus-iteration2-default.md
      - "Score: iteration 2, with r2": benchmark/scores/latrodectus-iteration2-r2.md
      - "Score: iteration 1, default model": benchmark/scores/latrodectus-iteration1-default.md
      - "Score: iteration 1, small model": benchmark/scores/latrodectus-iteration1-small.md
  - Paper: paper.md

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
    admonition:
      warning: material/shield-alert-outline
  font:
    text: Geist
    code: Geist Mono
  palette:
    # Three choices in one switch: follow the system, light, dark. Dark is the
    # default: a first visit stores the last entry here (see the header
    # override), so it must stay the dark one. The system entry's scheme is
    # what paints before the page script runs. The custom swatches are
    # defined in assets/extra.css, and nothing on the site eases between
    # colours.
    - media: "(prefers-color-scheme)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/monitor
        name: Follow the system appearance
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light appearance
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark appearance
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - assets/extra.css

plugins:
  - search

markdown_extensions:
  - toc:
      permalink: true
      title: On this page
  - tables
  - fenced_code
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
