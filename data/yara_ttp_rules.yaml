version: "1.0"
description: "Maljan built-in YARA-TTP rules for deterministic ATT&CK technique detection"
rules:
  # T1055 - Process Injection
  - id: process_injection_apis
    technique_id: "T1055"
    confidence: 0.90
    description: "Process injection via classic Windows APIs"
    platform: ["windows"]
    patterns:
      - "VirtualAllocEx"
      - "WriteProcessMemory"
      - "CreateRemoteThread"
      - "NtCreateThreadEx"
      - "QueueUserAPC"
      - "SetThreadContext"

  # T1055.012 - Process Hollowing
  - id: process_hollowing
    technique_id: "T1055.012"
    confidence: 0.92
    description: "Process hollowing indicators"
    platform: ["windows"]
    patterns:
      - "NtUnmapViewOfSection"
      - " hollow"
      - "RunPE"
      - "Process Hollowing"

  # T1547.001 - Registry Run Keys
  #
  # The key path, never the API name. `RegSetValueEx` is how a program writes
  # any value to any key, and matching it published T1547.001 at 0.88 against
  # a signed SSH client that stores its session settings under its own key.
  - id: registry_run_keys
    technique_id: "T1547.001"
    confidence: 0.88
    description: "Persistence via Registry Run/RunOnce keys"
    platform: ["windows"]
    patterns:
      - "CurrentVersion\\Run"
      - "CurrentVersion\\RunOnce"
      - "CurrentVersion\\RunServices"
      - "CurrentVersion\\Explorer\\Shell Folders\\Startup"
      - "Start Menu\\Programs\\Startup"

  # T1059.001 - PowerShell
  - id: powershell_execution
    technique_id: "T1059.001"
    confidence: 0.85
    description: "Command and scripting interpreter: PowerShell"
    platform: ["windows"]
    patterns:
      - "powershell.exe"
      - "powershell -enc"
      - "powershell -ep bypass"
      - "IEX("
      - "Invoke-Expression"
      - "-EncodedCommand"

  # T1059.003 - Windows Command Shell
  - id: cmd_execution
    technique_id: "T1059.003"
    confidence: 0.80
    description: "Command and scripting interpreter: cmd.exe"
    platform: ["windows"]
    patterns:
      - "cmd.exe /c"
      - "cmd.exe /k"

  # T1059.005 - Visual Basic
  - id: vbs_execution
    technique_id: "T1059.005"
    confidence: 0.80
    description: "Command and scripting interpreter: VBScript"
    platform: ["windows"]
    patterns:
      - "wscript.exe"
      - "cscript.exe"
      - "WScript.Shell"
      - "WScript.Network"

  # T1059.007 - JavaScript
  - id: js_execution
    technique_id: "T1059.007"
    confidence: 0.78
    description: "Command and scripting interpreter: JavaScript"
    platform: ["windows"]
    patterns:
      - "wscript.exe"
      - "mshta.exe"
      - "javascript:"
      - "JScript"

  # T1071.001 - Application Layer Protocol: Web Protocols
  # A string note, not a technique. Every program that checks for an update
  # calls these, so their presence cannot establish a C2 channel; what the
  # sample did on the wire is the sandbox's answer. The note still says the
  # names are there.
  - id: web_client_apis
    description: "HTTP client APIs are present (not evidence of C2 on their own)"
    platform: ["any"]
    patterns:
      - "HttpSendRequest"
      - "InternetOpenUrl"
      - "WinHttpConnect"
      - "URLDownloadToFile"

  # T1027 - Obfuscated Files or Information
  #
  # Packer artefacts, not the words for what they do. `AES`, `RC4`, `XOR`,
  # `Base64`, `packed` and a bare `UPX` are in every program that speaks a
  # protocol or compresses anything: fourteen occurrences of `aes` and one
  # `uPX` inside a longer word carried T1027 at 0.82 into a report about a
  # signed SSH client. A packer section name or a packer's own banner is a
  # fact about the file; the name of a cipher is not. Entropy is the other
  # half of this signal and belongs to the format tool, which reports the
  # section entropies beside these hits.
  - id: obfuscation_indicators
    technique_id: "T1027"
    confidence: 0.82
    description: "Obfuscation and packing indicators"
    platform: ["any"]
    patterns:
      - "UPX0"
      - "UPX1"
      - "UPX!"
      - "This file is packed with the UPX"
      - ".aspack"
      - ".adata"
      - ".themida"
      - ".winlice"
      - ".vmp0"
      - ".vmp1"
      - ".enigma1"
      - "MPRESS1"
      - "MPRESS2"
      - ".petite"
      - "PECompact2"
      - "FSG!"
      - ".nsp0"
      - ".boom"

  # T1027.002 - Software Packing
  #
  # Same rule about evidence: a section name a packer writes, not the word
  # "compress" — which an SSH client carries because it negotiates zlib.
  - id: software_packing
    technique_id: "T1027.002"
    confidence: 0.85
    description: "Software packing detected"
    platform: ["any"]
    patterns:
      - "UPX0"
      - "UPX1"
      - "UPX!"
      - ".aspack"
      - ".adata"
      - ".themida"
      - ".winlice"
      - ".vmp0"
      - "MPRESS1"
      - ".petite"
      - "PECompact2"
      - "FSG!"

  # T1083 - File and Directory Discovery
  # A string note: enumerating files is what a file manager, an installer and
  # a backup tool all do, so the API names cannot establish the technique.
  - id: file_enumeration_apis
    description: "File enumeration APIs are present (ubiquitous in benign software)"
    platform: ["windows"]
    patterns:
      - "FindFirstFile"
      - "FindNextFile"
      - "GetLogicalDrives"
      - "GetDriveType"

  # T1112 - Modify Registry
  - id: registry_modification
    technique_id: "T1112"
    confidence: 0.80
    description: "Registry modification for defense evasion"
    platform: ["windows"]
    patterns:
      - "DisableTaskMgr"
      - "DisableRegistryTools"
      - "DisableTaskManager"
      - "Policies\\System\\EnableLUA"
      - "Policies\\Explorer\\NoRun"

  # T1685 - Disable or Modify Tools (T1562.001 until ATT&CK 19.2)
  - id: disable_defense_tools
    technique_id: "T1685"
    confidence: 0.88
    description: "Disable or modify security tools"
    platform: ["windows"]
    patterns:
      - "Anti-Virus"
      - "Windows Defender"
      - "Set-MpPreference"
      - "DisableRealtimeMonitoring"
      - "TamperProtection"

  # T1497 - Virtualization/Sandbox Evasion
  # Cross-platform concept: anti-emu / anti-debug applies to any sandbox.
  # The patterns include both Win-flavored APIs and generic strings so the
  # rule is intentionally broad. Marked "any" because the Android case
  # (zararli.apk) legitimately uses the same evasion concept (sensor
  # listening = sandbox detection).
  - id: sandbox_evasion
    technique_id: "T1497"
    confidence: 0.85
    description: "Virtualization and sandbox evasion"
    platform: ["any"]
    # 2026-07 round 2: dropped bare "sandbox" — matched any incidental mention
    # of the word. Keep VM/debugger-detection-specific markers only.
    patterns:
      - "CheckRemoteDebuggerPresent"
      - "NtGlobalFlag"
      - "vmware"
      - "virtualbox"
      - "SbieDll"
      - "vboxservice"
      - "VBoxTray"

  # T1497.001 - System Checks
  # A string note. The timing APIs went earlier for being ubiquitous; the
  # user-activity ones are no different — reading the cursor, the foreground
  # window and the idle timer is what every interactive program does. The
  # pattern of use is the signal, and a substring cannot see it.
  - id: user_activity_apis
    description: "User-activity APIs are present (ubiquitous in interactive software)"
    platform: ["windows"]
    patterns:
      - "GetCursorPos"
      - "GetForegroundWindow"
      - "GetLastInputInfo"
      - "GetSystemFirmwareTable"

  # T1003 - OS Credential Dumping
  - id: credential_dumping
    technique_id: "T1003"
    confidence: 0.90
    description: "OS credential dumping"
    platform: ["windows"]
    patterns:
      - "mimikatz"
      - "sekurlsa"
      - "lsadump"
      - "samdump"
      - "WDigest"
      - "Kerberos ticket"

  # T1003.001 - LSASS Memory
  - id: lsass_dump
    technique_id: "T1003.001"
    confidence: 0.91
    description: "LSASS memory credential dumping"
    platform: ["windows"]
    patterns:
      - "lsass.exe"
      - "MiniDumpWriteDump"
      - "sekurlsa::logonpasswords"
      - "comsvcs.dll, MiniDump"
      - "comsvcs.dll MiniDump"

  # T1105 - Ingress Tool Transfer
  - id: tool_transfer
    technique_id: "T1105"
    confidence: 0.83
    description: "Ingress tool transfer"
    platform: ["windows"]
    patterns:
      - "certutil -urlcache"
      - "bitsadmin"
      - "mshta"
      - " rundll32"

  # T1218.011 - Rundll32
  - id: rundll32_abuse
    technique_id: "T1218.011"
    confidence: 0.87
    description: "System Binary Proxy Execution via rundll32"
    platform: ["windows"]
    patterns:
      - "rundll32.exe javascript:"
      - "rundll32.exe url.dll,OpenURL"
      - "rundll32.exe advpack.dll,LaunchINFSection"
      - "rundll32.exe shell32.dll,ShellExec_RunDLL"
      - "rundll32.exe zipfldr.dll,RouteTheCall"

  # T1218.005 - Mshta
  - id: mshta_abuse
    technique_id: "T1218.005"
    confidence: 0.87
    description: "System Binary Proxy Execution via mshta"
    platform: ["windows"]
    patterns:
      - "mshta.exe"
      - "mshta http"
      - "vbscript:"

  # T1218.010 - Regsvr32
  - id: regsvr32_abuse
    technique_id: "T1218.010"
    confidence: 0.85
    description: "System Binary Proxy Execution via regsvr32"
    platform: ["windows"]
    patterns:
      - "regsvr32.exe"
      - "scrobj.dll"
      - "/i:http"
      - "DllInstall"

  # T1486 - Data Encrypted for Impact (Ransomware)
  - id: ransomware_indicators
    technique_id: "T1486"
    confidence: 0.88
    description: "Ransomware data encryption indicators"
    platform: ["any"]
    patterns:
      - "YOUR FILES HAVE BEEN ENCRYPTED"
      - "ALL YOUR FILES ARE ENCRYPTED"
      - "HOW_TO_DECRYPT"
      - "DECRYPT_INSTRUCTION"
      - "_readme.txt"
      - "RECOVERY_KEY"
      - ".locked"
      - ".encrypted"

  # T1486 - Additional ransomware file extensions
  - id: ransomware_extensions
    technique_id: "T1486"
    confidence: 0.85
    description: "Ransomware file extension modification"
    platform: ["any"]
    patterns:
      - ".crypto"
      - ".vault"
      - ".onion"
      - ".crypt"
      - "YOUR_FILES"
      - "restore_files"

  # T1566.001 - Spearphishing Attachment
  - id: phishing_attachment
    technique_id: "T1566.001"
    confidence: 0.80
    description: "Spearphishing attachment delivery"
    platform: ["windows"]
    patterns:
      - "AutoOpen"
      - "Document_Open"
      - "AutoExec"
      - "Workbook_Open"
      - "vbaProject.bin"

  # T1204.002 - Malicious File
  # A string note: an interpreter's name and a file extension say what a
  # thing is, never that a user was tricked into running it. The technique is
  # about the delivery, which no static string witnesses.
  - id: scripted_runtime_markers
    description: "Scripted-runtime markers are present (the format, not the delivery)"
    platform: ["windows"]
    patterns:
      - "AutoIt3.exe"
      - "AutoHotkey.exe"
      - "AutoIt v3 Script"

  # T1053.005 - Scheduled Task/Job
  - id: scheduled_task
    technique_id: "T1053.005"
    confidence: 0.83
    description: "Scheduled task for persistence"
    platform: ["windows"]
    patterns:
      - "schtasks.exe"
      - "TaskScheduler"
      - "CreateScheduledTask"
      - "AT \\"
      - "cmd /c start"

  # T1543.003 - Windows Service
  # A string note: installing a service is what installers do, and these API
  # names are in every one of them. A service *as persistence* is the key
  # path and the command line, which the registry rule and the sandbox see.
  - id: service_control_apis
    description: "Service-control APIs are present (ubiquitous in installers)"
    platform: ["windows"]
    patterns:
      - "CreateService"
      - "StartService"
      - "OpenSCManager"

  # T1574.001 - DLL (side-loading; T1574.002 until ATT&CK merged it into T1574.001)
  - id: dll_side_loading
    technique_id: "T1574.001"
    confidence: 0.85
    description: "DLL side-loading for execution"
    platform: ["windows"]
    # 2026-07 round 2: dropped bare "LoadLibrary" — the most common Windows API,
    # present in nearly every PE, which caused T1574.002 to fire on benign MFC
    # apps. Keep only side-loading-specific indicator strings.
    patterns:
      - "side-load"
      - "sideload"
      - "DLL Search Order"
      - "phantom dll"
      - "DllHijack"

  # T1001 - Data Obfuscation
  - id: data_obfuscation
    technique_id: "T1001"
    confidence: 0.78
    description: "Data obfuscation for C2 communication"
    platform: ["any"]
    patterns:
      - "steganography"
      - "covert channel"
      - "DNS tunnel"
      - "ICMP tunnel"
      - "domain fronting"

  # T1078 - Valid Accounts
  - id: valid_accounts
    technique_id: "T1078"
    confidence: 0.75
    description: "Abuse of valid accounts for access"
    platform: ["any"]
    patterns:
      - "default password"
      - "admin:admin"
      - "password123"
      - "brute force"
      - "credential stuffing"
      - "pass the hash"
