services:
  # ─────────────────────────────────────────────
  # PostgreSQL 16 — Relational data store
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: maljan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maljan}
      POSTGRES_USER: ${POSTGRES_USER:-maljan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maljan_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maljan} -d ${POSTGRES_DB:-maljan}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Redis 7 — Task queue, PubSub, cache
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: maljan-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────────
  # Qdrant — Vector database (LTM / RAG)
  # ─────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: maljan-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # ─────────────────────────────────────────────
  # MinIO — S3-compatible object storage
  # ─────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: maljan-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
  # -────────────────────────────────────────────
  # Backend API — FastAPI application server
  # -────────────────────────────────────────────
  backend-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: maljan-api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-maljan}:${POSTGRES_PASSWORD:-maljan_dev}@postgres:5432/${POSTGRES_DB:-maljan}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
    volumes:
      - ../src:/app/src
      - ../apps:/app/apps
      - ../data:/app/data
      - ../tests:/app/tests
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: >
      uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # -────────────────────────────────────────────
  # Backend Worker — ARQ background task runner
  # -────────────────────────────────────────────
  backend-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: maljan-worker
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-maljan}:${POSTGRES_PASSWORD:-maljan_dev}@postgres:5432/${POSTGRES_DB:-maljan}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
    volumes:
      - ../src:/app/src
      - ../apps:/app/apps
      - ../data:/app/data
      - ../tests:/app/tests
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      uv run arq app.worker.analysis_worker.WorkerSettings

  # -────────────────────────────────────────────
  # Frontend — Next.js UI application
  # -────────────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: maljan-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://backend-api:8000
      NEXT_PUBLIC_WS_URL: ws://backend-api:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend-api

volumes:
  pgdata:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  minio_data:
    driver: local
