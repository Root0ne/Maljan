# One backend image for the three services that run this codebase (migrations,
# API, worker). Declared once and tagged explicitly, so compose builds and
# stores a single image instead of one per service.
x-backend-image: &backend-image
  build:
    context: ..
    dockerfile: docker/Dockerfile.backend
  image: maljan-backend
  # A fixed unprivileged uid/gid (the image's own account, 10001), no Linux
  # capability, and no way to gain one it was not started with (a setuid
  # binary, a file capability) (AUD-32-M5). The image's virtual environment
  # and sources are root-owned, so read-only to this user. MALJAN_UID and
  # MALJAN_GID run them under another id instead: a host whose login user
  # also writes data/ sets them to that user's ids (`make docker-up` and
  # `make dev-up` do, when neither the environment nor docker/.env does). The
  # volume-init service below hands what root owns in the writable volumes to
  # whichever id this is, and refuses to start the stack over anyone else's.
  user: "${MALJAN_UID:-10001}:${MALJAN_GID:-10001}"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  # ─────────────────────────────────────────────
  # PostgreSQL 16 — Relational data store
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: maljan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maljan}
      POSTGRES_USER: ${POSTGRES_USER:-maljan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env (see README)}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maljan} -d ${POSTGRES_DB:-maljan}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Redis 7 — Task queue, PubSub, cache
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: maljan-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env (see README)}",
        "--appendonly",
        "yes",
      ]
    environment:
      # Read by redis-cli itself (not the server), so the healthcheck below
      # authenticates without the password ever appearing in argv/`docker inspect`.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env (see README)}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      # Exec form never runs through a shell, so "$$REDIS_PASSWORD" was passed
      # to redis-cli as the literal four-character string "$REDIS_PASSWORD",
      # and redis-cli exits 0 on WRONGPASS regardless — the container reported
      # healthy no matter what. CMD-SHELL runs through /bin/sh, so REDISCLI_AUTH
      # is picked up from the environment and the exit code is tied to an
      # actual PONG via grep.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────────
  # Qdrant — Vector database (LTM / RAG), optional
  # ─────────────────────────────────────────────
  # Started under the `qdrant` profile, which the shipped docker/.env turns on
  # (COMPOSE_PROFILES=ghidra,qdrant); an operator may take it out. Without it,
  # set `memory.backend` = `memory` (long-term memory in process); with it,
  # `memory.backend` = `qdrant` and its url `http://qdrant:6333`. Nothing else
  # waits for it.
  qdrant:
    profiles: [qdrant]
    # F3 (2026-07-05): pin instead of ``:latest`` for reproducibility. An
    # unpinned server drifted to 1.18.x while the pinned qdrant-client is
    # 1.17.1, which logged "Failed to obtain server version. Unable to check
    # client-server compatibility" on every run. Pinning removes that drift.
    image: qdrant/qdrant:v1.18.2@sha256:75eab8c4ba42096724fdcfde8b4de0b5713d529dde32f285a1f86fdcb2c9e50c
    container_name: maljan-qdrant
    restart: unless-stopped
    environment:
      # Not a `:?` guard: Compose interpolates every service, the ones whose
      # profile is off as well, so a guard here would stop a stack that never
      # runs Qdrant. The entrypoint below refuses to start without the key, so
      # the container restarts and logs the variable to set.
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    entrypoint:
      - /bin/sh
      - -c
      - '[ -n "$$QDRANT__SERVICE__API_KEY" ] || { echo "set QDRANT_API_KEY in docker/.env (see README)" >&2; exit 1; }; exec ./entrypoint.sh'
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${QDRANT_PORT:-6333}:6333"
      - "${BIND_ADDRESS:-127.0.0.1}:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # ─────────────────────────────────────────────
  # MinIO — S3-compatible object storage
  # ─────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: maljan-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in docker/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in docker/.env}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -────────────────────────────────────────────
  # Ghidra MCP Headless — a static analyser, optional
  # -────────────────────────────────────────────
  # Started (and built from external/ghidra-mcp) under the `ghidra` profile,
  # which the shipped docker/.env turns on; an operator may take it out. It is
  # one static analyser among the ones a deployment can attach; nothing waits
  # for it, and a job whose team needs a provider that is not ready is refused
  # with the reason (provider_readiness).
  ghidra-mcp:
    profiles: [ghidra]
    build:
      context: ../external/ghidra-mcp
      dockerfile: docker/Dockerfile
    image: ghidra-mcp-headless:latest
    container_name: maljan-ghidra-mcp
    # `no` keeps a stopped container stopped across a reboot or a daemon
    # restart, for a host that starts Ghidra only for the runs that need it.
    restart: ${GHIDRA_RESTART:-unless-stopped}
    environment:
      # Not a `:?` guard, for the reason given on Qdrant above. The server
      # refuses to bind 0.0.0.0 without a token, so an unset one stops this
      # container and no other.
      GHIDRA_MCP_AUTH_TOKEN: ${GHIDRA_MCP_AUTH_TOKEN:-}
      GHIDRA_MCP_BIND_ADDRESS: 0.0.0.0
      GHIDRA_MCP_PORT: 8089
      # The JVM's options; the image's own default when unset. The heap cap
      # here and the container limit below move together: see the comment
      # on mem_limit for how much room off-heap memory needs.
      JAVA_OPTS: ${GHIDRA_JAVA_OPTS:--Xmx4g -XX:+UseG1GC}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GHIDRA_MCP_PORT:-8089}:8089"
    # A ceiling the kernel enforces, because the JVM's own does not bound the
    # container. `-Xmx4g` caps the *heap*; Ghidra's database is memory-mapped and
    # its direct buffers live outside it, so RSS was measured at 5.15 GB while
    # the heap was nominally capped at 4. With no container limit, a binary whose
    # analysis is pathological grows until the host runs out and the kernel's OOM
    # killer picks the largest process — which on a desktop is the editor, not
    # this container. That happened twice on 2026-08-10/11.
    #
    # 6g leaves the 4g heap its room plus off-heap headroom. Past it the
    # container's own process dies, the HTTP call fails, and the harness records
    # an error and moves on — which is the behaviour we want from a sample
    # Ghidra cannot handle. Swap is pinned to the same value so the container
    # cannot trade the limit for thrashing. GHIDRA_MEM_LIMIT sets both; keep it
    # about 2g above the heap GHIDRA_JAVA_OPTS gives the JVM.
    mem_limit: ${GHIDRA_MEM_LIMIT:-6g}
    memswap_limit: ${GHIDRA_MEM_LIMIT:-6g}
    volumes:
      # The right-hand side is Ghidra's declared sample_mount
      # (core.static.ghidra.sample_mount): change the two together.
      # The worker writes its mirrors 0700/0600 as MALJAN_UID. Ghidra reads
      # them only because its image runs as root; a Ghidra that runs as
      # another user needs a group it shares with the worker and mirrors
      # written 0750/0640 for it.
      - ../data/samples:/data/samples:ro
      - ghidra_projects:/projects
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8089/check_connection || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # -────────────────────────────────────────────
  # Volume ownership — one-shot, before api and worker
  # -────────────────────────────────────────────
  # The backend services used to run as root, so an existing deployment's
  # sample mirror, upload staging and ATT&CK cache are owned by root, and the
  # unprivileged services could not write them. This hands the entries of those
  # three that root owns, and nothing else, to MALJAN_UID:MALJAN_GID. It never
  # takes a file from anyone else: an entry owned by neither root nor that id
  # stops it, before it has changed anything, with the id to set, and the stack
  # does not start. It changes ownership only (chown, never content or mode),
  # never through a symbolic link and never past the mount, so a second run
  # changes nothing, and executes nothing it finds. It runs as root with the
  # one capability chown needs and the one that lets it enter the 0700 work
  # directories, with no network, and exits.
  volume-init:
    <<: *backend-image
    container_name: maljan-volume-init
    restart: "no"
    user: "0:0"
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
    network_mode: none
    environment:
      MALJAN_UID: ${MALJAN_UID:-10001}
      MALJAN_GID: ${MALJAN_GID:-10001}
    # Each target names its source after /own/, which is how a refusal names it.
    volumes:
      - ../data/samples:/own/data/samples
      - ../data/uploads:/own/data/uploads
      - attck_cache:/own/attck_cache
    command:
      - /bin/sh
      - -euc
      - |
        for id in "$$MALJAN_UID" "$$MALJAN_GID"; do
          case "$$id" in ''|*[!0-9]*) id=0;; esac
          if [ "$$id" -eq 0 ]; then
            echo "volume-init: MALJAN_UID and MALJAN_GID must be non-zero numbers" >&2
            exit 1
          fi
        done
        dirs="/own/data/samples /own/data/uploads /own/attck_cache"
        for dir in $$dirs; do
          owner=$$(find "$$dir" -xdev ! -uid 0 ! -uid "$$MALJAN_UID" -printf '%U\n' -quit)
          if [ -n "$$owner" ]; then
            echo "volume-init: $${dir#/own/} is owned by uid $$owner;" \
              "set MALJAN_UID/MALJAN_GID=$$owner in docker/.env" >&2
            exit 1
          fi
          group=$$(find "$$dir" -xdev ! -gid 0 ! -gid "$$MALJAN_GID" -printf '%G\n' -quit)
          if [ -n "$$group" ]; then
            echo "volume-init: $${dir#/own/} is owned by gid $$group;" \
              "set MALJAN_GID=$$group in docker/.env" >&2
            exit 1
          fi
        done
        for dir in $$dirs; do
          find "$$dir" -xdev \( -uid 0 -o -gid 0 \) -exec chown -h "$$MALJAN_UID:$$MALJAN_GID" {} +
        done

  # -────────────────────────────────────────────
  # Migrations — one-shot Alembic upgrade, before api and worker
  # -────────────────────────────────────────────
  # A fresh stack has an empty database, and the API does not migrate on
  # startup (RUN_MIGRATIONS_ON_STARTUP stays false: a multi-replica deployment
  # must not have every replica racing the same upgrade). Without this step no
  # table the API reads exists and every request fails until someone migrates
  # by hand. Runs to completion once; api and worker wait for its exit code.
  migrate:
    <<: *backend-image
    container_name: maljan-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-maljan}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env (see README)}@postgres:5432/${POSTGRES_DB:-maljan}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in docker/.env}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?set SETTINGS_ENCRYPTION_KEY in docker/.env}
      # Retired; read once into core.validation.attck_refresh_days by the
      # revision that retired it, when docker/.env still sets it.
      MALJAN_ATTCK_MAX_AGE_DAYS: ${MALJAN_ATTCK_MAX_AGE_DAYS:-}
    volumes:
      - ../src:/app/src:ro
      - ../apps:/app/apps:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      uv run --directory apps/api alembic upgrade head

  # -────────────────────────────────────────────
  # Backend API — FastAPI application server
  # -────────────────────────────────────────────
  backend-api:
    <<: *backend-image
    container_name: maljan-api
    restart: unless-stopped
    # Bootstrap contract only (apps/api/app/bootstrap.py) — every other
    # application setting (LLM provider, sandbox, static analyst, tool
    # servers, Qdrant access, rate limits, ...) lives in the settings store
    # and is edited from Settings -> Configuration, not passed as env.
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-maljan}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env (see README)}@postgres:5432/${POSTGRES_DB:-maljan}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in docker/.env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in docker/.env}
      # The audit chain's anchor outside the database (bootstrap.env.example):
      # unset keeps the chain checked against its database head only.
      AUDIT_ANCHOR: ${AUDIT_ANCHOR:-}
      AUDIT_ANCHOR_DATABASE_URL: ${AUDIT_ANCHOR_DATABASE_URL:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in docker/.env}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?set SETTINGS_ENCRYPTION_KEY in docker/.env}
      SAMPLES_DIR: data/samples
      UPLOAD_TEMP_DIR: data/uploads/.tmp
      # This stack runs the enrichment-worker service below, so an enrichment
      # is queued for it rather than for the analysis worker's single slot.
      # It is the setting's *default*, not an override: an operator who saves
      # api.enrichment_dedicated_worker in the console still wins. A
      # deployment that drops that service drops this line with it, or its
      # enrichments sit in a queue nobody reads — the status endpoint and the
      # worker's own startup warning both say so when that happens.
      ENRICHMENT_DEDICATED_WORKER: "true"
      RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
      # APISettings.cookie_secure is bool | None; an empty string fails
      # pydantic validation outright (env_ignore_empty defaults to False), so
      # this must always resolve to a real boolean, never "".
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    # F8 (2026-07-05): on Linux ``host.docker.internal`` does not resolve
    # unless mapped to the host gateway (Docker Desktop on Win/Mac provides
    # it natively, where this is a harmless no-op). Lets the container reach
    # a host llama-server or sandbox at host.docker.internal:<port>, when the
    # settings store's LLM/sandbox URLs point there.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The source trees are read-only: a process in this container that opens
    # hostile bytes cannot plant code the API or a later worker would run, or
    # change the host's working tree. data/ is read-only as well (its rule sets
    # and reference tables are only read); only the sample mirrors and the
    # upload staging under it are writable. The development overlay mounts the
    # sources writable.
    volumes:
      - ../src:/app/src:ro
      - ../apps:/app/apps:ro
      - ../data:/app/data:ro
      - ../data/samples:/app/data/samples
      - ../data/uploads:/app/data/uploads
      - ../tests:/app/tests:ro
      - ../services:/app/services:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      volume-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The worker waits on this: the healthcheck gates it on an API that has
    # finished its startup, so a job is never taken while the settings store
    # and its caches are still coming up.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # No --reload here: a reload runs whatever Python lands under /app. The
    # development overlay turns it back on.
    command: >
      uv run uvicorn app.main:app --host 0.0.0.0 --port 8000

  # -────────────────────────────────────────────
  # Backend Worker — ARQ background task runner
  # -────────────────────────────────────────────
  backend-worker:
    <<: *backend-image
    container_name: maljan-worker
    restart: unless-stopped
    # Bootstrap contract only (apps/api/app/bootstrap.py, shared with the
    # API) — LLM provider, sandbox, static analyst and Qdrant access are
    # application settings, read from the settings store at job start, not
    # passed as env. The allocator/embedding knobs below are process-level
    # tuning outside the settings catalog and stay here.
    #
    # Staging is deliberately not named here. What the tool sidecars stage —
    # uploads, carved payloads and the sandbox captures they are pointed at —
    # goes into this container's own temp directory, one directory per job
    # (`/tmp/maljan-analysis-mcp/job-<id>/`), removed when the job ends and
    # swept on a TTL after that. It is live malware, so it is left on the
    # container's writable layer rather than put on a named volume where it
    # would outlive the container. An operator who does want it elsewhere sets
    # the analysis and network servers' MALJAN_STAGING_DIR in the console; the
    # per-job directory inside it is composed by the worker and is not a
    # setting (see apps/docs/content/docs/configuration.mdx).
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-maljan}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env (see README)}@postgres:5432/${POSTGRES_DB:-maljan}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in docker/.env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in docker/.env}
      # The audit chain's anchor outside the database (bootstrap.env.example):
      # unset keeps the chain checked against its database head only.
      AUDIT_ANCHOR: ${AUDIT_ANCHOR:-}
      AUDIT_ANCHOR_DATABASE_URL: ${AUDIT_ANCHOR_DATABASE_URL:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in docker/.env}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?set SETTINGS_ENCRYPTION_KEY in docker/.env}
      SAMPLES_DIR: data/samples
      UPLOAD_TEMP_DIR: data/uploads/.tmp
      # This stack runs the enrichment-worker service below, so an enrichment
      # is queued for it rather than for the analysis worker's single slot.
      # It is the setting's *default*, not an override: an operator who saves
      # api.enrichment_dedicated_worker in the console still wins. A
      # deployment that drops that service drops this line with it, or its
      # enrichments sit in a queue nobody reads — the status endpoint and the
      # worker's own startup warning both say so when that happens.
      ENRICHMENT_DEDICATED_WORKER: "true"
      # glibc allocator (2026-07-26 memory audit). The image is python:3.13-slim
      # (glibc) and the host has 32 cores, so the default arena cap is 8 x ncores
      # = 256 arenas of 64 MB each. This process is genuinely multi-threaded —
      # the arq loop, the persistent agent loop, LangGraph's node threads and
      # asyncio's to_thread executor — which is the textbook shape for RSS that
      # climbs and never returns even when nothing is retained. Capping arenas
      # and lowering the trim threshold costs throughput only under malloc
      # contention, and this workload waits on an LLM. Revert by deleting both
      # lines; ``memprobe`` reports whether they helped.
      MALLOC_ARENA_MAX: "2"
      MALLOC_TRIM_THRESHOLD_: "134217728"
      # Ask the allocator to return freed heap at each job boundary, and report
      # how much came back — the reading that distinguishes fragmentation from
      # retention. Cheap; leave it on.
      MALJAN_MALLOC_TRIM: "1"
      WORKER_RSS_RESTART_MB: ${WORKER_RSS_RESTART_MB:-6000}
      # onnxruntime sizes its CPU arena from the host core count. Left alone on
      # a 32-core box, embedding the 697 ATT&CK technique texts reserved 8.3 GB
      # and was OOM-killed; at these values the same work peaks near 1.3 GB.
      # See ``src/maljan/memory/embeddings.py`` for the measurements. Raise them
      # on a host with memory to spare — the cost is only build time.
      MALJAN_EMBED_THREADS: ${MALJAN_EMBED_THREADS:-2}
      MALJAN_EMBED_BATCH: ${MALJAN_EMBED_BATCH:-32}
    # F8 (2026-07-05): resolve host.docker.internal on Linux (see backend-api).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Hard ceiling (2026-07-26). One analysis took this process from 3.4 GB to
    # 8.5 GB and never gave it back; two in a row exhausted a 30 GB host that
    # also runs a ~15 GB llama-server, and the machine locked up. The graceful
    # path is ``after_job_end`` in WorkerSettings, which exits between jobs; this
    # is what catches a single job that runs away mid-flight. The kernel kills
    # only this container, ``restart: unless-stopped`` brings it back, and the
    # startup orphan sweep repairs the job row it was holding.
    mem_limit: 8g
    memswap_limit: 8g
    # Read-only sources and data, as on the API (see there).
    volumes:
      - ../src:/app/src:ro
      - ../apps:/app/apps:ro
      - ../data:/app/data:ro
      - ../data/samples:/app/data/samples
      - ../data/uploads:/app/data/uploads
      - ../tests:/app/tests:ro
      - ../services:/app/services:ro
      # Derived caches, not source data — but expensive enough that losing them
      # is a production problem rather than a warm-up. Two things live here: the
      # 40 MB ATT&CK STIX bundle (re-downloaded from MITRE when absent), and the
      # ATT&CK embedding cache, whose absence costs the judge node +1.3 GB of
      # resident memory and 105 s on the first analysis — measured 2026-07-28.
      # Without this volume both are rebuilt on every container recreation,
      # because HOME is in the container's writable layer and a rebuild
      # discards it. The volume keeps its name from when the worker ran as
      # root and mounted it at /root/.cache/maljan; volume-init hands it over.
      - attck_cache:/home/maljan/.cache/maljan
    depends_on:
      volume-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      backend-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      uv run arq app.worker.analysis_worker.WorkerSettings
    # How long ``docker stop`` waits after SIGTERM before it kills the worker:
    # the sum of the worker's own shutdown bounds (``shutdown_budget_seconds``
    # in analysis_worker.py, held to this value by a test) — the pipeline's
    # stop grace, keeping the stopped run (its partial report and run summary;
    # measured at about 0.1 s of work on run 7's 342-entry ledger and 2.1 MB
    # report, plus one commit), the job teardown, the two connections and the
    # exit guard: 10 + 10 + 60 + 2 × 10 + 10. Docker's default of 10 s killed
    # the worker before the stop could be recorded.
    stop_grace_period: 110s

  # -────────────────────────────────────────────
  # Enrichment worker — ARQ, the post-verdict reputation lookups
  # -────────────────────────────────────────────
  # A second process on a queue of its own (``arq:queue:enrichment``). The
  # analysis worker runs one job at a time because two analyses would share one
  # model and one memory budget; an enrichment waits on somebody else's HTTP
  # and needs none of that, and while it shared the queue it spent 452 s of a
  # measured run holding the slot the next analysis was waiting for.
  #
  # Cheap to run: no pipeline, no sample download, no model. Two jobs at a time
  # (``ENRICHMENT_MAX_JOBS``), because they share one VirusTotal key and one
  # AbuseIPDB key and those providers rate-limit per key.
  #
  # Dropping this service means dropping ``ENRICHMENT_DEDICATED_WORKER`` from
  # backend-api and backend-worker above with it: without the service, that
  # line queues enrichments where nothing reads them. The setting ships off, so
  # a deployment that never adds either keeps one process and runs the
  # enrichment between analyses.
  enrichment-worker:
    <<: *backend-image
    container_name: maljan-enrichment-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-maljan}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env (see README)}@postgres:5432/${POSTGRES_DB:-maljan}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in docker/.env}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?set SETTINGS_ENCRYPTION_KEY in docker/.env}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in docker/.env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in docker/.env}
      # The audit chain's anchor outside the database (bootstrap.env.example):
      # unset keeps the chain checked against its database head only.
      AUDIT_ANCHOR: ${AUDIT_ANCHOR:-}
      AUDIT_ANCHOR_DATABASE_URL: ${AUDIT_ANCHOR_DATABASE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 2g
    volumes:
      - ../src:/app/src:ro
      - ../apps:/app/apps:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      uv run arq app.worker.enrich_worker.EnrichmentWorkerSettings

  # -────────────────────────────────────────────
  # Frontend — Next.js UI application
  # -────────────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
        # Audit 2026-07-26 (K3): NEXT_PUBLIC_* values are baked at build time,
        # and a developer's apps/web/.env.local used to leak `true` into the
        # bundle, silently disabling authentication for every visitor.
        # .dockerignore now excludes that file, and the value must be an
        # explicit, deliberate choice — defaulting to SECURE. Set
        # NEXT_PUBLIC_AUTH_DISABLED=true in .env only for a local dev stack.
        NEXT_PUBLIC_AUTH_DISABLED: "${NEXT_PUBLIC_AUTH_DISABLED:-false}"
    container_name: maljan-frontend
    restart: unless-stopped
    # The image runs as its unprivileged ``node`` user (Dockerfile.frontend),
    # which needs no capability and gains none.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend-api

volumes:
  pgdata:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  minio_data:
    driver: local
  ghidra_projects:
    driver: local
  attck_cache:
    driver: local
